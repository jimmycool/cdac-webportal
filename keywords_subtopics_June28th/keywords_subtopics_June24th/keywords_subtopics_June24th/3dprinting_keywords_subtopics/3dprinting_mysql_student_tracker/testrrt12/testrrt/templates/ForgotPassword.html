<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-image: url('/static/3dprinting_jpg_banner.png') ;
      background-repeat:repeat-x;
      display: flex;
      align-items:center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      width: min(100%, 440px);
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: popIn 0.25s ease;
    }

    .modal-header {
      padding: 20px 24px 8px;
      position: relative;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .modal-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      border: none;
      background: transparent;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-body {
      padding: 12px 24px 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover { transform: translateY(-1px); }

    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      from { transform: translateY(8px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body background="static/3dprinting_jpg_banner.png">
  <div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
    <div class="modal">
      <div class="modal-header">
        <button class="close-btn" type="button" aria-label="Close">×</button>
        <h2 id="forgot-title">Forgot Password?</h2>
        <p>Enter your email address and we'll send you a reset link.</p>
      </div>
      <div class="modal-body">
        <form method="post">
          {% csrf_token %}
          <div class="field">
            {{ form.as_div }}
          </div>
          <div class="actions">
            <button class="btn-secondary" type="button">Cancel</button>
            <button class="btn-primary" type="submit">Send Reset Link</button>
          </div>
        </form>
        <div class="hint">Remember your password? <a href="/login">Sign in</a></div>
      </div>
    </div>
  </div>
</body>
</html>
